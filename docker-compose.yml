version: '3.8'

services:
  db:
    image: postgres:14-alpine
    container_name: jt-db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-jt_documents}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: 'no'
    networks:
      - jt-network

  redis:
    image: redis:7-alpine
    container_name: jt-redis-llm
    ports:
      - '6380:6379' # Mapeamos el puerto 6380 (fuera) al 6379 (dentro)
    restart: 'no'
    networks:
      - jt-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jt-app
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      # NODE_ENV y las 3 vars de conexión SÍ deben diferir entre local/Docker
      # (host `db`/`redis` en vez de `localhost`) — es la única excepción a
      # la unificación: no son "ubicación de carpeta", son direccionamiento
      # de red interno de Docker Compose.
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-jt_documents}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_LOCATION=${GCP_LOCATION}
      - DOCUMENT_AI_PROCESSOR_ID=${DOCUMENT_AI_PROCESSOR_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/secret.json
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - db
      - redis
    volumes:
      # Todas las rutas de archivos (SOURCE_PATH_*, EXCEL_DESTINATION_PATH,
      # OCR_DESTINATION_PATH, OCR_UNREADABLE_PATH) ya NO se hardcodean acá
      # arriba en `environment:` — vienen del `.env` (vía `env_file`), con
      # el MISMO nombre de variable que usa el `.env` local. El montaje es
      # "espejo": ruta del host == ruta que ve la app adentro del
      # contenedor, así no hace falta una variable `_HOST_PATH` separada
      # para cada una.
      - ./local:/app/local
      - ${SOURCE_PATH_1}:${SOURCE_PATH_1}
      - ${SOURCE_PATH_2}:${SOURCE_PATH_2}
      - ${SOURCE_PATH_3}:${SOURCE_PATH_3}
      - ${SOURCE_PATH_MASIVOS}:${SOURCE_PATH_MASIVOS}
      - ${OCR_DESTINATION_PATH}:${OCR_DESTINATION_PATH}
      - ${EXCEL_DESTINATION_PATH}:${EXCEL_DESTINATION_PATH}
      - ${OCR_UNREADABLE_PATH}:${OCR_UNREADABLE_PATH}
      - ./secrets:/app/secrets
    restart: 'no'
    networks:
      - jt-network

volumes:
  pgdata:

networks:
  jt-network:
    driver: bridge
