version: "3.8"

services:
  db:
    image: postgres:14-alpine
    container_name: jt-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-jt_documents}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: "no"
    networks:
      - jt-network

  redis:
    image: redis:7-alpine
    container_name: jt-redis-llm
    ports:
      - "6380:6379" # Mapeamos el puerto 6380 (fuera) al 6379 (dentro)
    restart: "no"
    networks:
      - jt-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jt-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-jt_documents}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # GCP & Gemini
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_LOCATION=${GCP_LOCATION}
      - DOCUMENT_AI_PROCESSOR_ID=${DOCUMENT_AI_PROCESSOR_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/secret.json
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - db
      - redis
    volumes:
      - ./local:/app/local
      - ${SERVER_PATH_EMBARGOS}:/app/local/EMBARGOS
      - ${SERVER_PATH_DESEMBARGOS}:/app/local/DESEMBARGOS
      - ${SERVER_PATH_ALCANCES}:/app/local/ALCANCES
      - ${SERVER_PATH_MASIVOS}:/app/local/MASIVOS
      - ${OCR_DESTINATION_HOST_PATH:-./local/ocr-done}:/opt/ocr-done
      - ${EXCEL_DESTINATION_HOST_PATH:-./local/excel-done}:/opt/excel-done
      - ${OCR_UNREADABLE_HOST_PATH:-./local/ocr-unreadable}:/opt/ocr-unreadable
      - ./secrets:/app/secrets
    restart: "no"
    networks:
      - jt-network

volumes:
  pgdata:

networks:
  jt-network:
    driver: bridge
